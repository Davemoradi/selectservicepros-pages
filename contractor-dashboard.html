<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Contractor Dashboard — Select Service Pros</title>
<link rel="icon" href="/favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --orange:#f05528; --orange2:#d94a20; --orange-soft:rgba(240,85,40,.08); --orange-tint:#fdece5;
  --navy:#0a1628; --navy2:#122240; --navy-soft:rgba(10,22,40,.06);
  --bg:#f8f7f4; --white:#ffffff; --border:#e5e4e0; --border-strong:#d8d6d0;
  --text1:#111318; --text2:#3d3f44; --text3:#6b6e76; --text4:#9ca0a8;
  --green:#1a8a4a; --green-soft:#e6f9ed; --red:#e53e3e; --red-soft:#fee2e2;
  --yellow:#d97706; --yellow-soft:#fef3c7; --blue:#2563eb; --blue-soft:#eff6ff;
  --radius:12px; --radius-sm:8px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(10,22,40,.04), 0 1px 3px rgba(10,22,40,.03);
  --shadow:0 2px 8px rgba(10,22,40,.04), 0 4px 16px rgba(10,22,40,.04);
  --shadow-md:0 4px 14px rgba(10,22,40,.06), 0 10px 30px rgba(10,22,40,.06);
  --shadow-lg:0 10px 30px rgba(10,22,40,.08), 0 20px 60px rgba(10,22,40,.08);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text1);-webkit-font-smoothing:antialiased;line-height:1.45}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text1)}
::selection{background:var(--orange-tint);color:var(--navy)}

/* ===== TOP NAV ===== */
.nav{background:var(--navy);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.nav-logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.01em}
.nav-logo .ls{color:var(--orange)}
.nav-right{display:flex;align-items:center;gap:14px}
.nav-contractor{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;background:rgba(255,255,255,.06);border-radius:999px}
.nav-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#f38961);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.nav-name{color:#fff;font-size:13px;font-weight:600;line-height:1}
.nav-meta{display:flex;gap:6px;margin-top:3px}
.status-pill{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:.02em}
.status-pill.pending{background:rgba(217,119,6,.2);color:#fbd38d}
.status-pill.review{background:rgba(37,99,235,.22);color:#a5c4f7}
.status-pill.active{background:rgba(26,138,74,.22);color:#7ad99f}
.nav-logout{color:rgba(255,255,255,.75);font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;transition:.15s var(--ease)}
.nav-logout:hover{background:rgba(255,255,255,.08);color:#fff}

/* ===== LAYOUT WRAP ===== */
.shell{display:flex;min-height:calc(100vh - 60px)}
.sidebar{display:none;width:240px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);padding:24px 14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
body[data-nav="sidebar"] .sidebar{display:block}
body[data-nav="sidebar"] .tabs-top{display:none}
body[data-nav="sidebar"] .shell-main{padding-top:24px}
.sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;transition:.15s var(--ease);margin-bottom:2px}
.sidebar-link:hover{background:var(--bg);color:var(--text1)}
.sidebar-link.active{background:var(--navy);color:#fff}
.sidebar-link svg{flex-shrink:0;opacity:.85}
.sidebar-link .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:var(--orange);opacity:0;transition:.15s}
.sidebar-link.has-badge .dot{opacity:1}
.sidebar-group{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 6px}

.shell-main{flex:1;min-width:0}
.page{max-width:1160px;margin:0 auto;padding:0 24px 80px}

/* ===== TOP TABS ===== */
.tabs-top{position:sticky;top:60px;background:var(--bg);z-index:50;padding:0 24px;border-bottom:1px solid var(--border)}
.tabs-top-inner{max-width:1160px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-top-inner::-webkit-scrollbar{display:none}
.tab{position:relative;padding:18px 16px 16px;font-size:14px;font-weight:600;color:var(--text3);white-space:nowrap;cursor:pointer;transition:color .15s var(--ease)}
.tab:hover{color:var(--text1)}
.tab.active{color:var(--navy)}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--orange);border-radius:2px 2px 0 0}
.tab .count{display:inline-block;background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:6px;vertical-align:2px}

/* ===== HEADER / GREETING ===== */
.page-header{padding:32px 0 20px}
.page-header h1{font-family:'DM Sans',sans-serif;font-weight:800;font-size:clamp(26px,3.2vw,34px);color:var(--navy);letter-spacing:-.025em;line-height:1.1}
.page-header .sub{font-size:14px;color:var(--text3);margin-top:6px}
.page-header .row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ===== CARDS ===== */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card.pad{padding:22px}
.card.hover{transition:.2s var(--ease)}
.card.hover:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden}
.stat-label{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.stat-label svg{opacity:.7}
.stat-value{font-family:'DM Sans',sans-serif;font-weight:600;font-size:30px;color:var(--navy);line-height:1;letter-spacing:-.02em}
.stat-sub{font-size:12px;color:var(--text3);margin-top:6px;display:flex;align-items:center;gap:4px}
.stat-delta{font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.stat-delta.down{background:var(--red-soft);color:var(--red)}
.stat.accent{background:linear-gradient(135deg,var(--navy) 0%,#162a4a 100%);border:none;color:#fff}
.stat.accent .stat-label{color:rgba(255,255,255,.55)}
.stat.accent .stat-value{color:#fff}
.stat.accent .stat-sub{color:rgba(255,255,255,.65)}

/* ===== SECTION TITLES ===== */
.section{margin-bottom:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;color:var(--navy);letter-spacing:-.02em}
.section-link{font-size:13px;font-weight:600;color:var(--orange);cursor:pointer}
.section-link:hover{color:var(--orange2)}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s var(--ease);white-space:nowrap;border:1px solid transparent}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--orange2);box-shadow:0 4px 12px rgba(240,85,40,.25)}
.btn-primary:disabled{background:var(--border-strong);color:var(--text4);cursor:not-allowed;box-shadow:none}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover:not(:disabled){background:var(--navy2)}
.btn-ghost{background:var(--white);color:var(--text2);border-color:var(--border-strong)}
.btn-ghost:hover:not(:disabled){background:var(--bg);border-color:var(--text4);color:var(--text1)}
.btn-danger{background:var(--white);color:var(--red);border-color:#f3bcbc}
.btn-danger:hover:not(:disabled){background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ===== STEPPER WIZARD (Pending Profile banner) ===== */
.wizard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);overflow:hidden;position:relative}
.wizard-top{background:linear-gradient(135deg,var(--navy) 0%,#18304f 60%,#1f3a5e 100%);color:#fff;padding:28px 32px 26px;position:relative;overflow:hidden}
.wizard-top::before{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;background:radial-gradient(circle,rgba(240,85,40,.18) 0%,transparent 70%)}
.wizard-top::after{content:"";position:absolute;right:40px;bottom:-40px;width:120px;height:120px;border:1px solid rgba(255,255,255,.07);border-radius:50%}
.wiz-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:10px}
.wiz-eyebrow .pulse{width:8px;height:8px;background:var(--orange);border-radius:50%;box-shadow:0 0 0 0 rgba(240,85,40,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,85,40,.55)}70%{box-shadow:0 0 0 10px rgba(240,85,40,0)}100%{box-shadow:0 0 0 0 rgba(240,85,40,0)}}
.wiz-title{font-family:'DM Sans',sans-serif;font-weight:800;font-size:clamp(22px,2.8vw,30px);letter-spacing:-.025em;line-height:1.1;max-width:640px}
.wiz-subtitle{font-size:14px;color:rgba(255,255,255,.72);margin-top:8px;max-width:580px}
.wiz-progress{margin-top:22px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.wiz-bar{flex:1;height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;position:relative}
.wiz-bar-fill{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--orange) 0%,#ff7a4d 100%);border-radius:999px;transition:width .6s var(--ease);box-shadow:0 0 20px rgba(240,85,40,.4)}
.wiz-pct{font-family:'DM Sans',sans-serif;font-weight:600;font-size:22px;color:#fff;min-width:54px;text-align:right}

.wizard-body{display:grid;grid-template-columns:260px 1fr;min-height:420px}
.wiz-steps{border-right:1px solid var(--border);padding:18px 10px;background:#fafaf7;overflow-y:auto}
.wiz-step{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:10px;cursor:pointer;transition:.15s var(--ease);margin-bottom:2px}
.wiz-step:hover{background:var(--white)}
.wiz-step.active{background:var(--white);box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.wiz-step-ico{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--white);transition:.2s var(--ease);margin-top:1px}
.wiz-step.done .wiz-step-ico{background:var(--green);border-color:var(--green)}
.wiz-step.done .wiz-step-ico svg{color:#fff;opacity:1}
.wiz-step-ico svg{opacity:0;transition:.2s}
.wiz-step.active .wiz-step-ico{border-color:var(--orange)}
.wiz-step-num{font-size:11px;font-weight:700;color:var(--text4)}
.wiz-step.done .wiz-step-num{display:none}
.wiz-step-txt{flex:1;min-width:0}
.wiz-step-title{font-size:13px;font-weight:600;color:var(--text1);line-height:1.3}
.wiz-step.done .wiz-step-title{color:var(--text3);text-decoration:line-through;text-decoration-color:var(--border-strong)}
.wiz-step-sub{font-size:11px;color:var(--text4);margin-top:2px}
.wiz-step-current{width:3px;background:var(--orange);border-radius:2px;align-self:stretch;margin:-2px 0;opacity:0;transition:.15s}
.wiz-step.active .wiz-step-current{opacity:1}

.wiz-content{padding:30px 34px;display:flex;flex-direction:column}
.wiz-content-head{margin-bottom:20px}
.wiz-tag{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.wiz-h{font-family:'DM Sans',sans-serif;font-weight:700;font-size:24px;color:var(--navy);letter-spacing:-.02em;line-height:1.2}
.wiz-d{font-size:14px;color:var(--text3);margin-top:4px;max-width:520px}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.01em}
.field .hint{font-size:11px;color:var(--text4);margin-top:5px}
.input,.textarea,.select{width:100%;padding:10px 12px;background:var(--white);border:1px solid var(--border-strong);border-radius:10px;font-size:14px;color:var(--text1);transition:.15s var(--ease);font-family:inherit}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.textarea{min-height:84px;resize:vertical;line-height:1.5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row-3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}

/* category / zip pills */
.pill-picker{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--white);border:1px solid var(--border-strong);border-radius:999px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s var(--ease)}
.pill:hover{border-color:var(--text4);color:var(--text1)}
.pill.selected{background:var(--navy);border-color:var(--navy);color:#fff}
.pill.zip{background:var(--orange-soft);border-color:transparent;color:var(--orange2);font-weight:600}
.pill .x{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;opacity:.6}
.pill:hover .x{opacity:1}
.zip-input{display:flex;gap:8px}
.zip-input .input{max-width:160px}

/* file upload */
.uploader{border:1.5px dashed var(--border-strong);border-radius:12px;padding:20px;background:var(--bg);text-align:center;transition:.15s var(--ease);cursor:pointer;position:relative}
.uploader:hover{border-color:var(--orange);background:var(--orange-soft)}
.uploader.has-file{border-style:solid;border-color:var(--green);background:#f3fbf5;text-align:left;padding:14px}
.uploader-ico{width:36px;height:36px;margin:0 auto 8px;background:var(--white);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text3)}
.uploader-title{font-size:13px;font-weight:600;color:var(--text2)}
.uploader-sub{font-size:11px;color:var(--text4);margin-top:3px}
.file-row{display:flex;align-items:center;gap:12px}
.file-thumb{width:44px;height:44px;border-radius:8px;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--green);flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:600;color:var(--text1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-meta{font-size:11px;color:var(--text3);margin-top:2px}
.file-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:.15s}
.icon-btn:hover{background:var(--white);color:var(--text1)}

.wiz-missing{background:#fff8e6;border:1px solid #f5d97f;border-left:4px solid #e6a700;border-radius:10px;padding:14px 16px;margin:0 0 20px;color:#6b4d00}
.wiz-missing-title{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.wiz-missing-list{margin:0;padding-left:22px;font-size:13.5px;line-height:1.7;color:#533c00}
.wiz-missing-list li{margin:2px 0}
.wiz-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.wiz-foot .muted{font-size:12px;color:var(--text4)}

/* ===== LEADS ===== */
.filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 14px;background:var(--white);border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;transition:.15s var(--ease);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--text4);color:var(--text1)}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{font-size:11px;padding:0 6px;border-radius:999px;background:var(--border);color:var(--text3);font-weight:700;min-width:18px;text-align:center}
.chip.active .c{background:rgba(255,255,255,.18);color:#fff}
.search{flex:1;min-width:200px;max-width:280px;display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--white);border:1px solid var(--border);border-radius:999px;color:var(--text3)}
.search:focus-within{border-color:var(--orange);color:var(--text1);box-shadow:0 0 0 3px var(--orange-soft)}
.search input{flex:1;border:none;outline:none;font-size:13px;background:transparent}

.leads-list{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lead-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s}
.lead-row:last-child{border-bottom:none}
.lead-row:hover{background:#fafaf7}
.lead-row.expanded{background:#fafaf7}
.lead-ico{width:40px;height:40px;border-radius:10px;background:var(--orange-soft);color:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lead-main{min-width:0}
.lead-head-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lead-svc{font-size:14px;font-weight:700;color:var(--navy)}
.lead-sub{font-size:12.5px;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.urg.emergency{background:var(--red-soft);color:var(--red)}
.urg.soon{background:var(--yellow-soft);color:var(--yellow)}
.urg.planning{background:var(--blue-soft);color:var(--blue)}
.lead-meta{text-align:right;font-size:12px}
.lead-fee{font-weight:700;color:var(--text1)}
.lead-time{color:var(--text4);margin-top:2px}
.lead-cta{display:flex;gap:6px;align-items:center}
.lead-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.s-new{background:var(--orange-tint);color:var(--orange2)}
.s-accepted{background:var(--green-soft);color:var(--green)}
.s-passed{background:var(--bg);color:var(--text4)}
.s-expired{background:var(--yellow-soft);color:var(--yellow)}

.lead-expand{display:none;padding:0 18px 20px 74px;border-bottom:1px solid var(--border);background:#fafaf7;animation:slidedown .25s var(--ease)}
.lead-row.expanded + .lead-expand{display:block}
@keyframes slidedown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.lead-detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;padding-top:10px}
.lead-desc{font-size:13.5px;color:var(--text2);line-height:1.55}
.lead-facts{display:flex;flex-direction:column;gap:10px}
.fact{display:flex;align-items:flex-start;gap:10px;font-size:13px}
.fact-lbl{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.fact-val{font-weight:500;color:var(--text1)}
.fact a{color:var(--orange);font-weight:600}
.phone-big{font-family:'DM Sans',sans-serif;font-weight:600;font-size:20px;color:var(--green);letter-spacing:-.01em}

/* ===== BILLING ===== */
.plan-card{position:relative;background:linear-gradient(135deg,var(--navy) 0%,#18304f 100%);color:#fff;border-radius:var(--radius-lg);padding:28px;overflow:hidden}
.plan-card::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(240,85,40,.22) 0%,transparent 70%)}
.plan-card-inner{position:relative;z-index:1}
.plan-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px}
.plan-name-big{font-family:'DM Sans',sans-serif;font-weight:800;font-size:32px;letter-spacing:-.025em}
.plan-price-big{font-size:14px;color:rgba(255,255,255,.75);margin-top:4px}
.plan-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.plan-btn{padding:10px 16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;backdrop-filter:blur(8px)}
.plan-btn:hover{background:rgba(255,255,255,.18)}
.plan-btn.primary{background:var(--orange);border-color:transparent}
.plan-btn.primary:hover{background:var(--orange2)}

.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.tier{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;transition:.2s var(--ease)}
.tier.current{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.tier.current::before{content:"Current";position:absolute;top:-9px;right:14px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.05em;text-transform:uppercase}
.tier-name{font-family:'DM Sans',sans-serif;font-weight:600;font-size:20px;color:var(--navy)}
.tier-price{font-size:13px;color:var(--text3);margin-top:4px}
.tier-ul{list-style:none;margin:14px 0 16px;padding:0;font-size:13px;color:var(--text2)}
.tier-ul li{display:flex;align-items:center;gap:8px;padding:4px 0}
.tier-ul li svg{color:var(--green);flex-shrink:0}

.billing-break{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.break-item{background:var(--bg);border-radius:10px;padding:16px}
.break-lbl{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.06em}
.break-val{font-family:'DM Sans',sans-serif;font-weight:800;font-size:26px;color:var(--navy);letter-spacing:-.02em;margin-top:4px}
.break-sub{font-size:12px;color:var(--text3);margin-top:2px}

/* ===== SETTINGS toggles ===== */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-info h4{font-size:14px;font-weight:600;color:var(--text1)}
.toggle-info p{font-size:12.5px;color:var(--text3);margin-top:2px}
.switch{position:relative;width:40px;height:22px;background:var(--border-strong);border-radius:999px;cursor:pointer;transition:.2s var(--ease);flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on::after{left:20px}

.danger-zone{background:#fff5f5;border:1px solid var(--red-soft);border-radius:var(--radius);padding:20px;margin-top:20px}
.danger-zone h3{font-family:'DM Sans',sans-serif;font-weight:600;color:var(--red);font-size:18px}
.danger-zone p{font-size:13px;color:var(--text2);margin-top:4px;margin-bottom:14px}

/* ===== EMPTY STATE ===== */
.empty{text-align:center;padding:56px 20px}
.empty svg{margin:0 auto 16px}
.empty h3{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;color:var(--navy);margin-bottom:6px}
.empty p{font-size:14px;color:var(--text3);max-width:360px;margin:0 auto 18px;line-height:1.5}

/* ===== TOAST ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;z-index:1000;transition:transform .3s var(--ease);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast .undo{margin-left:8px;padding:4px 10px;background:rgba(255,255,255,.15);border-radius:6px;font-weight:700;font-size:12.5px;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.toast .undo:hover{background:rgba(255,255,255,.25)}
.toast .close{opacity:.7;cursor:pointer;margin-left:4px}
.toast .close:hover{opacity:1}

/* ===== TABS CONTENT FADE ===== */
.tab-panel{animation:fadein .25s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ===== BANNER VARIANTS ===== */
body[data-banner="hero"] .wizard{min-height:72vh}
body[data-banner="hero"] .wizard-top{padding:48px 48px 40px}
body[data-banner="hero"] .wiz-title{font-size:clamp(28px,4vw,40px)}
body[data-banner="card"] .wizard-body{display:block}
body[data-banner="card"] .wiz-steps{border-right:none;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:10px}
body[data-banner="card"] .wiz-content{display:none}
body[data-banner="card"] .wiz-top-cta{display:inline-flex}
.wiz-top-cta{display:none;margin-top:22px;position:relative;z-index:1}

/* ===== SAVE INDICATOR ===== */
.save-indicator{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text4);opacity:0;transition:.2s;margin-left:10px;vertical-align:3px}
.save-indicator.show{opacity:1}
.save-indicator.saving{color:var(--text3)}
.save-indicator.saved{color:var(--green)}
.save-indicator .dot-anim{width:6px;height:6px;background:currentColor;border-radius:50%}
.save-indicator.saving .dot-anim{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ===== TWEAKS PANEL ===== */
.tweaks{position:fixed;bottom:20px;right:20px;width:300px;background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);z-index:200;overflow:hidden;display:none}
body.show-tweaks .tweaks{display:block}
.tweaks-head{padding:12px 16px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em}
.tweaks-head .close{cursor:pointer;opacity:.7}
.tweaks-head .close:hover{opacity:1}
.tweaks-body{padding:16px;max-height:60vh;overflow-y:auto}
.tweak{margin-bottom:14px}
.tweak-lbl{font-size:11px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.tweak-options{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px}
.tweak-options button{flex:1;padding:6px 8px;font-size:12px;font-weight:600;color:var(--text3);border-radius:6px;transition:.15s}
.tweak-options button.on{background:var(--white);color:var(--navy);box-shadow:var(--shadow-sm)}
.tweak-options button:hover:not(.on){color:var(--text1)}
.slider-wrap{display:flex;align-items:center;gap:10px}
.slider-wrap input[type=range]{flex:1;accent-color:var(--orange)}
.slider-wrap .val{font-size:12px;font-weight:700;color:var(--navy);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* ===== CATEGORY ACCORDION ===== */
.cat-accordion{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--white)}
.cat-row{border-bottom:1px solid var(--border);transition:background .15s}
.cat-row:last-child{border-bottom:none}
.cat-row.selected{background:#fcfbf9}
.cat-row.open{background:var(--bg)}
.cat-head{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;user-select:none}
.cat-head:hover{background:var(--bg)}
.cat-check{display:flex;align-items:center;cursor:pointer}
.cat-check input{width:18px;height:18px;accent-color:var(--orange);cursor:pointer}
.cat-name{font-size:15px;font-weight:600;color:var(--navy)}
.cat-meta{font-size:12px;color:var(--text4);font-weight:500}
.cat-row.selected .cat-meta{color:var(--orange);font-weight:600}
.cat-chev{color:var(--text3);transition:transform .2s var(--ease)}
.cat-row.open .cat-chev{transform:rotate(180deg)}
.cat-body{padding:8px 16px 18px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;animation:slidedown .2s var(--ease)}
.cat-hint{grid-column:1/-1;font-size:13px;color:var(--text4);font-style:italic;padding:4px 0}
.sub-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:.12s var(--ease)}
.sub-item:hover{background:var(--white)}
.sub-item input{accent-color:var(--orange);cursor:pointer}
.sub-item.on{color:var(--text1);font-weight:500}

/* ===== HOURS TABLE ===== */
.hours-table{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.hours-row{display:grid;grid-template-columns:60px 140px 1fr auto;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--border);transition:.15s}
.hours-row:last-child{border-bottom:none}
.hours-row.closed{background:#fafaf7}
.hours-row.closed .hr-times,.hours-row.closed .hr-day{opacity:.5}
.hr-day{font-size:13px;font-weight:700;color:var(--navy)}
.hr-toggle{display:flex;align-items:center;gap:10px}
.hr-status{font-size:12px;font-weight:600;color:var(--text3);min-width:44px}
.switch.sm{width:32px;height:18px}
.switch.sm::after{width:14px;height:14px}
.switch.sm.on::after{left:16px}
.hr-times{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.input.time{max-width:120px;padding:7px 10px;font-size:13px}
.input.time:disabled{background:var(--bg);color:var(--text4);cursor:not-allowed}
.hr-sep{font-size:12px;color:var(--text4)}
.hr-247{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;padding:6px 10px;border-radius:8px;border:1px solid var(--border)}
.hr-247:hover{background:var(--bg)}
.hr-247 input{accent-color:var(--orange)}

/* ===== RADIO GRID ===== */
.radio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}
.radio-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:10px;cursor:pointer;font-size:13px;color:var(--text2);transition:.15s var(--ease);background:var(--white)}
.radio-item:hover{border-color:var(--text4);color:var(--text1)}
.radio-item.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange2);font-weight:600}
.radio-item input{accent-color:var(--orange)}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(10,22,40,.55);backdrop-filter:blur(3px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .2s var(--ease)}
.modal{background:var(--white);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:modalpop .24s var(--ease)}
@keyframes modalpop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border);gap:12px}
.modal-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;color:var(--navy);letter-spacing:-.02em}
.modal-sub{font-size:12.5px;color:var(--text3);margin-top:4px}
.modal-scroll{flex:1;overflow-y:auto;padding:22px 24px;background:var(--bg);position:relative;max-height:42vh;min-height:200px;border-bottom:1px solid var(--border)}
.agree-text{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.agree-scroll-hint{position:sticky;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg) 50%,transparent);text-align:center;font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.08em;padding:18px 0 4px;margin:0 -24px -22px}
.modal-foot{padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.check-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text2);cursor:pointer;line-height:1.45}
.check-row input{accent-color:var(--orange);margin-top:2px;cursor:pointer;width:16px;height:16px;flex-shrink:0}
.check-row input:disabled{cursor:not-allowed;opacity:.4}
.check-row input:disabled + span{color:var(--text4)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

/* ===== MOBILE ===== */
@media(max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .wizard-body{grid-template-columns:1fr}
  .wiz-steps{border-right:none;border-bottom:1px solid var(--border);max-height:180px}
  .wiz-content{padding:22px}
  .tiers{grid-template-columns:1fr}
  .billing-break{grid-template-columns:1fr}
  .lead-row{grid-template-columns:auto 1fr;gap:12px;padding:12px 14px}
  .lead-row .lead-meta{grid-column:2;text-align:left;display:flex;gap:10px;align-items:center}
  .lead-row .lead-cta{grid-column:1/-1;justify-content:flex-end;padding-top:4px}
  .lead-expand{padding-left:14px}
  .lead-detail-grid{grid-template-columns:1fr}
  body[data-nav="sidebar"] .sidebar{display:none}
  body[data-nav="sidebar"] .tabs-top{display:block}
  .tweaks{right:10px;left:10px;width:auto;bottom:10px}
  .hours-row{grid-template-columns:60px 120px 1fr;gap:10px}
  .hr-247{grid-column:1/-1;justify-self:start}
  .cat-body{padding-left:20px;grid-template-columns:1fr 1fr}
  .modal{max-height:94vh}
  .modal-scroll{max-height:38vh}
}
@media(max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .field-row,.field-row-3{grid-template-columns:1fr}
  .plan-name-big{font-size:26px}
  .page{padding:0 16px 60px}
  .tabs-top{padding:0 16px}
  .nav{padding:0 14px}
  .nav-contractor .nav-name{display:none}
  }

/* ===== CREDENTIALS ===== */
.licenses-list{display:flex;flex-direction:column;gap:14px}
.lic-card{border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;background:#fcfcfa;transition:border-color .15s,background .15s}
.lic-card:hover{border-color:#d9d6cf}
.lic-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lic-card-trade{font-family:'DM Sans',sans-serif;font-weight:600;font-size:17px;color:var(--navy);letter-spacing:-.01em}
.lic-card-type{color:var(--text4);font-weight:400;font-family:'DM Sans',sans-serif;font-size:13px}
.lic-card-meta{font-size:12px;color:var(--text4);margin-top:3px;font-variant-numeric:tabular-nums}
.lic-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.lic-pill.lic-verified{background:var(--green-soft);color:var(--green)}
.lic-pill.lic-pending{background:#fff4e0;color:#a65d10}
.lic-pill.lic-needed{background:#f3f2ee;color:var(--text3)}
.add-license-wrap{position:relative}
.add-license-select{width:auto;min-width:180px;padding:8px 30px 8px 12px;font-size:13px;font-weight:500;color:var(--navy);background-color:#fff;cursor:pointer}
.empty-inline{padding:24px 18px;text-align:center;border:1px dashed var(--border);border-radius:10px;background:#fafaf7}
.empty-inline p{font-size:14px;color:var(--text3);margin:0}
@media(max-width:560px){
  .lic-card{padding:14px 15px}
  .add-license-select{min-width:0;width:100%}
}

/* ---- offer card states (wallet / pay-per-accepted-lead model) ---- */
.lead-focus{
  box-shadow:0 0 0 2px var(--orange), 0 2px 12px rgba(240,85,40,.18);
  border-radius:12px;
  animation:leadFocusPulse 1.6s ease-out 2;
}
@keyframes leadFocusPulse{
  0%{box-shadow:0 0 0 2px var(--orange),0 0 0 0 rgba(240,85,40,.35);}
  70%{box-shadow:0 0 0 2px var(--orange),0 0 0 10px rgba(240,85,40,0);}
  100%{box-shadow:0 0 0 2px var(--orange),0 0 0 0 rgba(240,85,40,0);}
}
.lead-countdown{
  display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.01em;
  background:#fff3ee;color:#c2410c;border:1px solid #fed7c3;
}
.lead-countdown.expired{ background:#f1f5f9;color:#64748b;border-color:#e2e8f0; }
.locked-panel{
  background:#f8fafc;border:1px dashed var(--border-strong,#d8d6d0);
  border-radius:10px;padding:14px 16px;
}
.locked-panel .fact-lbl{ color:var(--text3); }
.locked-panel .fact-val{ color:var(--text2);font-weight:500;line-height:1.5; }
.btn[disabled]{ opacity:.45;cursor:not-allowed;pointer-events:none; }

/* ===== SSP DASHBOARD REFINEMENT ===== */
:root{
  --bg:#f5f6f8;--border:#e6e8ec;--border-strong:#d9dde3;
  --text1:#15191f;--text2:#424852;--text3:#6c7480;--text4:#969da7;
  --radius:10px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(10,22,40,.03);
  --shadow:0 4px 14px rgba(10,22,40,.04);
  --shadow-md:0 8px 24px rgba(10,22,40,.05);
}
body{background:var(--bg)}
.nav{height:64px;background:#fff;border-bottom:1px solid var(--border);box-shadow:none;padding:0 24px}
.nav-logo{color:var(--navy);font-size:16px}
.nav-contractor{background:#f5f6f8;border:1px solid var(--border);padding:5px 9px 5px 5px}
.nav-name{color:var(--navy)}
.nav-logout{color:var(--text3)}
.nav-logout:hover{background:#f5f6f8;color:var(--navy)}
.status-pill.pending{background:#fff7ed;color:#b45309}
.status-pill.review{background:#eff6ff;color:#1d4ed8}
.status-pill.active{background:#ecfdf3;color:#167a45}
.shell{min-height:calc(100vh - 64px)}
.sidebar{width:224px;top:64px;height:calc(100vh - 64px);padding:20px 12px;background:#fff}
.sidebar-group{padding:16px 12px 7px;font-size:10px;color:#a0a6af}
.sidebar-group:first-child{padding-top:4px}
.sidebar-link{padding:9px 11px;border-radius:8px;font-weight:550;color:#525964}
.sidebar-link:hover{background:#f6f7f9;color:var(--navy)}
.sidebar-link.active{background:#fff1eb;color:#c9471f}
.sidebar-link.active svg{color:var(--orange);opacity:1}
.nav-count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#fff1eb;color:#c9471f;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.page{max-width:1100px;padding:0 30px 72px}
.page-header{padding:28px 0 20px}
.page-header h1{font-size:30px;font-weight:700;letter-spacing:-.025em}
.page-header .sub{max-width:700px;font-size:14px}
.card{box-shadow:none}
.card.hover:hover{box-shadow:var(--shadow);transform:none}
.btn{border-radius:8px;font-weight:650}
.btn-primary:hover:not(:disabled){box-shadow:none}
.section{margin-bottom:30px}
.section-title{font-size:18px;font-weight:700}
.section-caption{font-size:12.5px;color:var(--text3);margin-top:3px}
.section-link{color:var(--text2)}
.section-link:hover{color:var(--orange)}
.stats{grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:30px}
.stat{padding:17px;border-radius:10px}
.stat-label{font-size:10.5px;letter-spacing:.055em;margin-bottom:9px}
.stat-value{font-size:27px;font-weight:650}
.stat.accent{background:var(--navy)}
.model-strip{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.model-strip>div{padding:14px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.model-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text4);font-weight:700}
.model-strip strong{font-size:13.5px;color:var(--navy)}
.model-link{padding:14px 16px;color:var(--orange);font-size:13px;font-weight:700;white-space:nowrap}
.review-card{padding:24px;margin-top:16px}
.review-copy{max-width:640px}
.review-copy h3{font-size:18px;color:var(--navy);margin-bottom:6px}
.review-copy p{font-size:14px;color:var(--text3);line-height:1.6}
.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.wizard{box-shadow:none;border-radius:12px}
.wizard-top{background:#fff;color:var(--navy);padding:24px 28px;border-bottom:1px solid var(--border)}
.wizard-top::before,.wizard-top::after{display:none}
.wiz-eyebrow{color:var(--orange);margin-bottom:7px;letter-spacing:.08em}
.wiz-eyebrow .pulse{display:none}
.wiz-title{font-size:25px;font-weight:700}
.wiz-subtitle{color:var(--text3);margin-top:6px}
.wiz-progress{margin-top:18px}
.wiz-bar{height:7px;background:#eceef2}
.wiz-bar-fill{background:var(--orange);box-shadow:none}
.wiz-pct{color:var(--text2);font-size:14px;font-weight:700;min-width:42px}
.wiz-top-cta{margin-top:18px!important}
.wizard-body{grid-template-columns:240px 1fr}
.wiz-steps{background:#fafbfc}
.wiz-step.active{box-shadow:none}
.wiz-step.done .wiz-step-title{text-decoration:none}
.wiz-content{padding:28px 30px}
.lead-principle{display:flex;gap:8px;align-items:baseline;background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:14px;font-size:13px;color:var(--text3)}
.lead-principle strong{color:var(--navy)}
.leads-list{border-radius:10px}
.lead-row{padding:15px 16px}
.lead-ico{width:36px;height:36px;border-radius:8px}
.lead-svc{font-size:13.5px}
.lead-fee{font-size:14px}
.billing-model{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.billing-model-item{padding:16px 18px;border-right:1px solid var(--border)}
.billing-model-item:last-child{border-right:none}
.billing-model-item span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text4);font-weight:700}
.billing-model-item strong{display:block;margin-top:4px;font-size:16px;color:var(--navy)}
.billing-model-item small{display:block;margin-top:3px;font-size:12px;color:var(--text3);line-height:1.4}
.wallet-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:12px}
.wallet-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text4);font-weight:700}
.wallet-total{font-size:36px;line-height:1.1;color:var(--navy);font-weight:700;letter-spacing:-.03em;margin-top:5px}
.wallet-breakdown{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--text3);font-size:12.5px}
.wallet-breakdown b{color:var(--text2)}
.wallet-note,.wallet-alert,.wallet-policy{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:18px;color:var(--text3);font-size:13px;line-height:1.55}
.wallet-note strong,.wallet-alert strong,.wallet-policy strong{color:var(--navy)}
.wallet-alert{display:flex;gap:7px;align-items:baseline;border-color:#f2d6c8;background:#fffaf7}
.wallet-options{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wallet-option{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px}
.wallet-option[aria-disabled="true"]{opacity:.55}
.wallet-option-label{font-size:11px;color:var(--text4);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wallet-option-amount{font-size:24px;font-weight:700;color:var(--navy);margin-top:5px}
.wallet-option-copy{font-size:12px;color:var(--text3);margin:2px 0 14px}
.purchase-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.purchase-flow>div{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px}
.flow-num{width:24px;height:24px;border-radius:50%;background:#fff1eb;color:#c9471f;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-bottom:12px}
.purchase-flow strong{display:block;font-size:14px;color:var(--navy)}
.purchase-flow p{font-size:12.5px;color:var(--text3);line-height:1.5;margin-top:5px}
.wallet-policy{margin-bottom:0}
.wallet-policy p{margin-top:4px}
@media(max-width:900px){
  .model-strip{grid-template-columns:1fr 1fr}
  .model-strip>div{border-bottom:1px solid var(--border)}
  .model-link{grid-column:1/-1}
  .billing-model,.wallet-options,.purchase-flow{grid-template-columns:1fr}
  .billing-model-item{border-right:none;border-bottom:1px solid var(--border)}
  .billing-model-item:last-child{border-bottom:none}
}
@media(max-width:560px){
  .page{padding:0 16px 56px}
  .stats{grid-template-columns:1fr 1fr}
  .wallet-hero{align-items:flex-start;flex-direction:column}
  .wallet-hero .btn{width:100%}
  .lead-principle{display:block}
  .lead-principle strong{display:block;margin-bottom:3px}
}

function escapeHTML(v){
  if(v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// Attribute-safe: same escaping, used where the value lands inside quotes.

// ---------- LICENSE HELPERS ----------
function licenseForTrade(trade){
  return state.credentials.licenses.find(l=>l.trade===trade);
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const then = new Date(dateStr).getTime();
  if(isNaN(then)) return null;
  return Math.floor((then - Date.now())/(1000*60*60*24));
}
function expiryBadge(dateStr){
  // Returns a small inline badge HTML for expiry urgency (or empty string).
  const d = daysUntil(dateStr);
  if(d===null) return '';
  if(d < 0) return `<span class="exp-badge exp-expired">Expired</span>`;
  if(d <= 30) return `<span class="exp-badge exp-soon">Expires in ${d} day${d===1?'':'s'}</span>`;
  if(d <= 60) return `<span class="exp-badge exp-warn">Expires in ${d} days</span>`;
  return '';
}
function addLicenseForTrade(trade){
  if(licenseForTrade(trade)) return;
  const defaultType = trade==='HVAC' ? 'State HVAC / Mechanical License'
    : trade==='Plumbing' ? 'State Plumbing License (Master)'
    : trade==='Electrical' ? 'State Electrical License (Master)'
    : 'Other';
  const licState = state.profile.state || '';
  // Optimistic local row; swap in the real UUID once the insert returns.
  const tempId = 'tmp_'+Date.now();
  const local = {
    id: tempId, trade, type: defaultType, state: licState,
    number:'', exp:'', file:'', verified:false, verifiedAt:null, notes:'',
  };
  state.credentials.licenses.push(local);
  if(!state.contractorId) return;
  (async ()=>{
    try {
      const { data, error } = await sb.from('contractor_licenses').insert({
        contractor_id: state.contractorId,
        trade_category: trade,
        license_type: defaultType,
        license_state: licState,
      }).select().single();
      if(error){ console.error('addLicense failed', error); return; }
      local.id = data.id;
      render();
    } catch(e){ console.error(e); }
  })();
}
function removeLicense(id){
  const l = state.credentials.licenses.find(x=>x.id===id);
  if(!l) return;
  state.credentials.licenses = state.credentials.licenses.filter(x=>x.id!==id);
  if(l.trade && state.categories.has(l.trade) && SSP_LICENSE_COLLECTION_TRADES.includes(l.trade)){
    state.categories.delete(l.trade);
    delete state.servicesDetail[l.trade];
  }
  if(!String(id).startsWith('tmp_')){
    sb.from('contractor_licenses').delete().eq('id', id)
      .then(({error})=>{ if(error) console.error('removeLicense failed', error); });
  }
  // Persist services set since we may have dropped a category.
  markSaving();
}

function getDoneSteps(){

  return STEPS.map(s=>{

function renderSidebar(){
  const el = document.getElementById('sidebar');
  const groups = [
    ['Work',['overview','leads','billing']],
    ['Business',['profile','operations','credentials']],
    ['Account',['settings']],
  ];
  let html = '';
  for(const [group,keys] of groups){
    html += `<div class="sidebar-group">${group}</div>`;
    for(const key of keys){
      const t = TABS.find(x=>x.key===key);
      if(!t) continue;
      const active = state.activeTab===t.key?'active':'';
      const hasBadge = t.badge && t.badge() ? 'has-badge' : '';
      const count = t.count && state.state==='active' ? t.count() : 0;
      const countBadge = count>0 ? `<span class="nav-count">${count}</span>` : '';
      html += `<div class="sidebar-link ${active} ${hasBadge}" onclick="setTab('${t.key}')">${t.icon()}<span>${t.label}</span>${countBadge}</div>`;
    }
  }
  el.innerHTML = html;
}

function renderTabs(){
  const el = document.getElementById('tabsInner');
  let html = '';
  TABS.forEach(t=>{
    const active = state.activeTab===t.key?'active':'';
    let suffix = '';
    if(t.count && state.state==='active'){
      const c = t.count();
      if(c>0) suffix = ` <span class="count">${c}</span>`;
    }
    html += `<button class="tab ${active}" onclick="setTab('${t.key}')" role="tab" aria-selected="${!!active}">${t.label}${suffix}</button>`;
  });
  el.innerHTML = html;
}

function stepContentHTML(step, idx){
  let body = '';

  else if(step.key==='categories') body = stepCategoriesAccordion();
  else if(step.key==='zips') body = stepZips();
  else if(step.key==='operations') body = stepOperations();
  else if(step.key==='licenses') body = stepLicenses();
  else if(step.key==='insurance') body = stepInsuranceFull();

  const isLast = idx === STEPS.length-1;
  const stepDone = (() => { try { return !!step.check(); } catch(e){ return false; } })();
  const missing = stepDone ? [] : missingFieldsFor(step.key);
  const missingBanner = (missing.length>0)
    ? `<div class="wiz-missing">
         <div class="wiz-missing-title">${iconAlert(16)} This step isn't complete yet — you can come back to it</div>

  `;
}

// Returns a list of plain-English reasons a step isn't complete yet.
// The list mirrors each STEP.check() predicate in STEPS (above). When
// everything required is present, the returned list is empty.
function missingFieldsFor(key){
  const out = [];
  switch(key){
    case 'description': {
      const len = (state.profile.description||'').length;
      if(len === 0) out.push('Business description (aim for 60–200 characters)');
      else if(len <= 40) out.push(`Business description is too short — you have ${len} characters, need at least 41`);
      break;
    }
    case 'years': {
      if(!(state.profile.years>0)) out.push('Years in business');
      break;
    }
    case 'categories': {
      if(state.categories.size===0){
        out.push('Select at least one service category');
      } else {
        for(const c of state.categories){
          if((state.servicesDetail[c]||[]).length===0){
            out.push(`At least one specific service under "${c}"`);
          }
          if(SSP_LICENSE_COLLECTION_TRADES.includes(c) && !licenseForTrade(c)){
            out.push(`A license record for ${c} (added on the Licenses step)`);
          }
        }
      }
      break;
    }
    case 'zips': {
      if(state.zips.length===0) out.push('At least one ZIP code you serve');
      break;
    }
    case 'operations': {
      if(!(state.operations.technicians>0)) out.push('Number of technicians on your team');
      if(!state.operations.phoneAnswered) out.push('Who answers your business phone');
      if(!(state.operations.payments && state.operations.payments.size>0)) out.push('At least one payment method you accept');
      const hasAnyOpenDay = DAYS.some(d=>state.operations.hours[d].open || state.operations.hours[d].open24);
      if(!state.operations.hoursConfirmed){
        out.push(hasAnyOpenDay
          ? 'Confirm your business hours (even if the defaults are right, toggle or adjust one day to confirm)'
          : 'Business hours for at least one day of the week');
      } else if(!hasAnyOpenDay){
        out.push('Set at least one day as open (or toggle 24/7)');
      }
      break;
    }
    case 'licenses': {
      const licensedSelected = [...state.categories].filter(c=>SSP_LICENSE_COLLECTION_TRADES.includes(c));
      if(licensedSelected.length===0) break;
      for(const c of licensedSelected){
        const l = licenseForTrade(c);
        if(!l){ out.push(`Add a ${c} license`); continue; }
        if(!l.number) out.push(`${c} license: license number`);
        if(!l.type)   out.push(`${c} license: license type`);
        if(!l.state)  out.push(`${c} license: issuing state`);
        if(!l.exp)    out.push(`${c} license: expiration date`);
        if(!l.file)   out.push(`${c} license: upload license document`);
      }
      break;
    }
    case 'insurance': {
      const i = state.credentials.insurance;
      if(!i.carrier) out.push('Insurance carrier name');
      if(!i.policy)  out.push('Policy number');
      if(!i.exp)     out.push('Policy expiration date');
      if(!i.file)    out.push('Upload your Certificate of Insurance (COI)');
      break;
    }
  }
  return out;
}

// Map UI field names → DB column names on contractor_licenses.
const LICENSE_FIELD_MAP = {
  trade: 'trade_category',
  type: 'license_type',
  state: 'license_state',
  number: 'license_number',
  exp: 'expiration_date',
  file: 'document_url',
  notes: 'notes',
  // verified / verified_at / verified_by are intentionally UNMAPPED. They are
  // admin-controlled; a DB trigger resets them when the contractor edits a
  // license field or replaces the document.
};
const _licPersistQueue = {}; // licId -> {pending: {col:val,...}, timer}
function updateLicense(id, field, value){
  const lic = state.credentials.licenses.find(l=>l.id===id);
  if(!lic) return;
  lic[field] = value;
  // Changing any field invalidates prior verification.
  if(field !== 'verified' && field !== 'verifiedAt') lic.verified = false;
  markSaving();
  // Only re-render for field changes that cause layout shifts (selects/dates/verified/file).
  // Text fields like `number` MUST NOT re-render on every keystroke — it blows away
  // the <input> DOM node, killing focus and dropping the last typed character.
  // The status pill (Incomplete/Pending/Verified) that depends on `number` will
  // update on the next natural re-render (blur, step change, etc).
  const TEXT_FIELDS = ['number', 'notes'];
  if(!TEXT_FIELDS.includes(field)) render();

  // Debounce a per-license DB update.
  if(String(id).startsWith('tmp_')) return; // not yet inserted — skip
  const col = LICENSE_FIELD_MAP[field];
  if(!col) return;
  let dbVal = value;
  if(field === 'exp') dbVal = value || null;
  if(!_licPersistQueue[id]) _licPersistQueue[id] = { pending:{}, timer:null };
  const q = _licPersistQueue[id];
  q.pending[col] = dbVal;
  // No verification reset written from here. A BEFORE UPDATE trigger on
  // contractor_licenses clears verified/verified_at/verified_by whenever the
  // contractor changes license details or the document, so it happens
  // regardless of what the client sends.
  clearTimeout(q.timer);
  q.timer = setTimeout(async ()=>{
    const payload = q.pending;
    q.pending = {};
    try {
      const { error } = await sb.from('contractor_licenses')
        .update(payload).eq('id', id);
      if(error) console.error('updateLicense DB error', error);
    } catch(e){ console.error('updateLicense exception', e); }
  }, 500);
}

// Opens a hidden file input, uploads the chosen file to Supabase Storage
// under the contractor's folder, and writes the storage PATH back to the DB.
// The bucket is PRIVATE; views go through a short-lived signed URL.
function fakeUpload(kind, replace){
  // Legacy name kept — only 'insurance' is still supported; license uploads
  // go through fakeLicenseUpload below.
  if(kind !== 'insurance') return;
  pickFile(async (file)=>{
    if(!validateUpload(file)) return;
    try {
      const url = await uploadDoc(file, 'insurance.' + fileExt(file));
      state.credentials.insurance.file = url;
      // Only the document path is written here. insurance_verified is an
      // admin-controlled column and the contractor holds no UPDATE grant on
      // it — see SSP-contractor-privileges.sql.
      //
      // Verification reset is handled by the DB trigger
      // trg_reset_insurance_verification: any change to insurance_doc_url (or
      // carrier / policy / expiration) sets insurance_verified = false. The
      // trigger is the security boundary — it holds regardless of what this
      // client sends or omits.
      await sb.from('contractors')
        .update({ insurance_doc_url: url })
        .eq('id', state.contractorId);
      state.credentials.insurance.verified = false;
      render();
      toast(replace?'File replaced · we\'ll verify soon':'Uploaded · we\'ll verify soon','success');
    } catch(e){
      console.error('insurance upload failed', e);
      toast('Upload failed — try again','error');
    }
  });
}

async function fakeLicenseUpload(licId, replace){
  pickFile(async (file)=>{
    if(!validateUpload(file)) return;
    try {
      const url = await uploadDoc(file, `license-${licId}.${esc(fileExt(file))}`);
      const lic = state.credentials.licenses.find(l=>l.id===licId);
      if(lic){ lic.file = url; lic.verified = false; }
      await sb.from('contractor_licenses')
        .update({ document_url: url })   // trigger resets verification
        .eq('id', licId);
      render();
      toast(replace?'File replaced · we\'ll verify soon':'Uploaded · we\'ll verify soon','success');
    } catch(e){
      console.error('license upload failed', e);
      toast('Upload failed — try again','error');
    }
  });
}

// ---- helpers ----
function pickFile(cb){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/pdf,image/jpeg,image/png';
  input.onchange = ()=>{ if(input.files && input.files[0]) cb(input.files[0]); };
  input.click();
}
function validateUpload(file){
  if(file.size > 10 * 1024 * 1024){ toast('File too large — 10 MB max','error'); return false; }
  const ok = ['application/pdf','image/jpeg','image/jpg','image/png'];
  if(!ok.includes(file.type)){ toast('PDF, JPG, or PNG only','error'); return false; }
  return true;
}
function fileExt(file){
  const fromName = (file.name||'').split('.').pop();
  if(fromName && fromName.length<=4) return fromName.toLowerCase();
  const map = {'application/pdf':'pdf','image/jpeg':'jpg','image/jpg':'jpg','image/png':'png'};
  return map[file.type] || 'bin';
}
// Insurance certificates and license documents are private. The bucket must
// NOT be public: these are business identity documents. We store only the
// object path and mint a short-lived signed URL when one is actually viewed.
async function uploadDoc(file, pathSuffix){
  if(!state.contractorId) throw new Error('No contractorId');
  const path = `${state.contractorId}/${pathSuffix}`;
  const { error: upErr } = await sb.storage.from('contractor-docs')
    .upload(path, file, { upsert: true, contentType: file.type });
  if(upErr) throw upErr;
  // Return the storage PATH, never a public URL.
  return path;
}

// Mint a signed URL valid for 5 minutes, at view time only.
// Removing a document must PERSIST. Clearing only local state left the DB
// still pointing at the old object, so the contractor saw "removed" while the
// stale certificate remained the record of truth and kept its verification.
//
// OBJECT RETENTION (deliberate): the storage object is NOT deleted. Insurance
// certificates and licences are evidence — if a dispute or a regulator asks
// what was on file in March, the file has to still exist. The bucket is
// private and unreferenced objects are unreachable without a signed URL.
// Purging superseded documents is a retention-policy job, not a UI action.
async function removeDoc(kind){
  if(!state.contractorId) return;
  if(!confirm('Remove this document? Your verification status will reset.')) return;
  try {
    if(kind === 'insurance'){
      const { error } = await sb.from('contractors')
        .update({ insurance_doc_url: null })   // trigger clears insurance_verified
        .eq('id', state.contractorId);
      if(error) throw error;
      state.credentials.insurance.file = '';
      state.credentials.insurance.verified = false;
    } else {
      state.credentials[kind].file = '';
    }
    render();
    toast('Removed. Verification reset.','success');
  } catch(e){
    console.error('removeDoc failed', e);
    toast('Could not remove that document. Please try again.','error',true);
  }
}

async function signedDocUrl(path, seconds){
  if(!path) return null;
  // Tolerate legacy rows that stored a full public URL before this change.
  if(/^https?:\/\//i.test(path)){
    const m = path.match(/contractor-docs\/(.+)$/);
    if(!m) return path;
    path = decodeURIComponent(m[1]);
  }
  const { data, error } = await sb.storage.from('contractor-docs')
    .createSignedUrl(path, seconds || 300);
  if(error){ console.error('signedDocUrl failed', error); return null; }
  return data && data.signedUrl ? data.signedUrl : null;
}

// Click handler for document links: resolve a signed URL, then open it.
async function openDoc(path){
  const url = await signedDocUrl(path, 300);
  if(!url){ toast('Could not open that document. Please try again.','error',true); return; }
  window.open(url, '_blank', 'noopener');
}

function canSignAgreement(){
  const a = state.agreement;
  // Accept any legal name the contractor types — it doesn't need to match the
  // profile name exactly (legal name may differ from display name, and profile
  // typos shouldn't block signing). We require at least 2 words and only
  // letters/spaces/hyphens/apostrophes/periods (standard name characters).
  const typed = (a.typedName || '').trim();
  const looksLikeName = /^[A-Za-z][A-Za-z .'\-]*\s+[A-Za-z][A-Za-z .'\-]*$/.test(typed);
  return a.scrolledEnd && a.readAgreed && a.authorized && looksLikeName;
}

async function acceptAgreement(){
  if(!canSignAgreement()) return;
  const signedName = state.agreement.typedName.trim();

  // No client-side IP lookup and no local pseudo-record. The server owns the
  // legal artifact: it sets accepted_at from its own clock, the IP from
  // x-forwarded-for, the user agent from the request header, and the version
  // from a server constant. A browser-captured IP is trivially spoofable and
  // a browser-captured timestamp is trivially backdated.

  // 2) Agreement record + status transition + GHL workflow — all server-side.
  //    The contractor holds no UPDATE privilege on status or on the
  //    agreement_* columns. Those are a legal artifact: the accepted_at
  //    timestamp, IP, and version are set by the server so they cannot be
  //    forged or backdated from the browser. Only the typed signature name
  //    travels from the client, and the server length-caps it.
  try {
    const headers = await authHeaders();
    if(!headers){ toast('Your session expired. Please sign in again.','error',true); return; }
    const resp = await fetch('/api/contractor-workflow', {
      method:'POST', headers,
      body: JSON.stringify({ action:'submit_for_review', signed_name: signedName })
    });
    const body = await resp.json().catch(()=>({}));
    if(!resp.ok || !body.ok){
      console.error('submit_for_review failed', resp.status, body && body.error);
      toast((body && body.message) || 'Could not submit — try again','error');
      return;
    }
    // Render the status the SERVER reports, not the one we hoped for. If an
    // admin rejected or suspended this account between page load and submit,
    // showing "under review" would be a lie.
    if(body.status){
      state.status = uiStatusFrom(body.status);
      state.dbStatus = body.status;
      if(isBlockedStatus(body.status)){
        toast('Your account status changed. Contact support.','error',true);
        render();
        return;
      }
    }
  } catch(e){
    console.error('submit_for_review request failed', e);
    toast('Could not submit — try again','error');
    return;
  }

  state.state = 'review';
  state.agreement.open = false;
  renderModal();
  render();
  toast("Your account is under review. We'll email you when the review is complete.",'success');
}

async function submitLeadDispute(leadId){
  const reasonEl=document.getElementById('leadDisputeReason');
  const evidenceEl=document.getElementById('leadDisputeEvidence');
  const btn=document.getElementById('leadDisputeSubmit');
  const reason=reasonEl?reasonEl.value:'';
  const evidence=evidenceEl?evidenceEl.value.trim():'';
  if(!reason){ toast('Choose a dispute reason.','error',true); return; }
  if(btn){ btn.disabled=true; btn.textContent='Submitting…'; }
  try{
    const headers=await authHeaders();
    if(!headers){ toast('Your session expired. Please sign in again.','error',true); return; }
    const res=await fetch('/api/lead-dispute',{
      method:'POST',headers,body:JSON.stringify({lead_id:leadId,reason,evidence})
    });
    const body=await res.json().catch(()=>({}));
    if(!res.ok||!body.ok){
      const messages={
        dispute_window_closed:'The 7-day dispute window has closed.',
        dispute_already_filed:'A dispute has already been filed for this lead.',
        no_accepted_charge:'This accepted lead charge could not be verified.'
      };
      throw new Error(body.message||messages[body.error]||'Could not submit the dispute.');
    }
    closeLeadDispute();
    toast('Dispute submitted. SSP will review it.','success',true);
  }catch(e){
    console.error('submitLeadDispute failed',e);
    toast(e.message||'Could not submit the dispute.','error',true);
    if(btn){ btn.disabled=false; btn.textContent='Submit dispute'; }
  }
}

let lastLeadAction = null;
// Current session access token. The API derives contractor identity from this
// token; it never trusts a contractor id sent from the browser.
async function authHeaders(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session || !session.access_token) return null;
  return {
    'Content-Type':'application/json',
    'Authorization':'Bearer ' + session.access_token,
  };
}

// Accept is server-side and atomic: the wallet debit and the offer claim commit
// together, or neither does. No optimistic status flip — a failed debit or a
// lost race must not look like a successful accept.
async function acceptLead(id){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  if(l.busy) return;
  l.busy = true; render();

  try {
    const headers = await authHeaders();
    if(!headers){ toast('Your session expired. Please sign in again.','error',true); return; }

    const res  = await fetch('/api/lead-accept', {
      method:'POST', headers, body: JSON.stringify({ lead_id: id })
    });
    const json = await res.json().catch(()=>({}));

    if(!res.ok || !json.ok){
      toast(json.message || 'Could not accept this lead.','error',true);
      await loadLeads();
      return;
    }

    l.status = 'accepted';
    l.rawStatus = 'accepted';
    lastLeadAction = null;                 // server-side charge: no client undo

    // Reveal homeowner details from the accept response, or fetch them.
    if(json.lead){
      l.unlocked = true;
      l.name    = json.lead.homeowner_name || '';
      l.phone   = json.lead.homeowner_phone || '';
      l.email   = json.lead.homeowner_email || '';
      l.address = json.lead.homeowner_address || json.lead.homeowner_street || '';
      l.desc    = json.lead.description || '';
    } else {
      await unlockLead(id);
    }

    state.expandedLead = id;
    await loadWallet();

    // lead_accepted is emitted atomically by the database outbox trigger.
    // The browser never sends GHL/customer notifications directly.

    const charged = json.charged_cents ? (json.charged_cents/100).toFixed(2) : l.fee;
    toast(`Accepted — $${charged} charged. Customer contact details are unlocked below.`,'success',true);
  } catch(e){
    console.error('acceptLead failed', e);
    toast('Network error. Please try again.','error',true);
  } finally {
    l.busy = false; render();
  }
}

async function passLead(id){
  const l = state.leads.find(x=>x.id===id); if(!l) return;
  if(l.busy) return;
  l.busy = true; render();

  try {
    const headers = await authHeaders();
    if(!headers){ toast('Your session expired. Please sign in again.','error',true); return; }

    const res  = await fetch('/api/lead-decline', {
      method:'POST', headers, body: JSON.stringify({ lead_id: id })
    });
    const json = await res.json().catch(()=>({}));

    if(!res.ok || !json.ok){
      toast(json.message || 'Could not pass on this lead.','error',true);
      await loadLeads();
      return;
    }

    l.status = 'passed';
    l.rawStatus = 'declined';
    lastLeadAction = null;

    // Cron is OFF, so nothing else will retry this. If the immediate refill
    // failed, the freed slot would otherwise just disappear — the lead keeps a
    // hole no contractor is ever offered. One safe retry, then log loudly.
    // Retrying is safe: fill_offer_slots is idempotent on slot count.
    if(json.refill_pending){
      try {
        const retry = await fetch('/api/lead-decline', {
          method:'POST', headers,
          body: JSON.stringify({ lead_id: id, refill_only: true })
        });
        const rj = await retry.json().catch(()=>({}));
        if(!retry.ok || rj.refill_pending){
          console.error('SSP-OPS: refill still pending after retry for lead', id,
                        '- slot will remain unfilled until matching runs again');
        }
      } catch(e){
        console.error('SSP-OPS: refill retry threw for lead', id, e);
      }
    }
    // No homeowner name in the toast — passed offers never unlock PII.
    toast(`Passed on the ${esc(l.service||'lead')} request in ${esc(l.zip)}.`,'success',true);
  } catch(e){
    console.error('passLead failed', e);
    toast('Network error. Please try again.','error',true);
  } finally {
    l.busy = false; render();
  }
}
function undoLast(){
  if(!lastLeadAction) return;
  const l = state.leads.find(x=>x.id===lastLeadAction.id);
  if(l){ l.status=lastLeadAction.prev; }
  lastLeadAction=null;
  hideToast();
  render();
  toast('Undone','success');
}

async function openTopUp(cents){
  if(state.state !== 'active'){
    toast('Wallet funding is available after your account is active.','error',true);
    return;
  }
  if(![10000,25000,50000].includes(Number(cents))){
    toast('That funding amount is not available.','error',true);
    return;
  }
  try {
    const { data:{ session } } = await sb.auth.getSession();
    const token = session && session.access_token;
    if(!token){ window.location.href='/contractor-login.html'; return; }
    toast('Opening secure Stripe checkout…');
    const resp = await fetch('/api/create-checkout-session', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
      body:JSON.stringify({ amount_cents:Number(cents) })
    });
    const body = await resp.json().catch(()=>({}));
    if(!resp.ok || !body.url){
      const msg = body.message || (body.error==='contractor_inactive' ? 'Your account must be active before funding.' : 'Could not open checkout. Please try again.');
      throw new Error(msg);
    }
    window.location.href = body.url;
  } catch(e){
    console.error('wallet top-up checkout failed', e);
    toast(e.message || 'Could not open checkout. Please try again.','error',true);
  }
}

async function requestAccountDeletion(){
  // No client-side status write and no client-held webhook. The contractor
  // does not hold UPDATE on contractors.status; /api/contractor-workflow
  // applies the transition and notifies ops under the service role.
  if(!confirm('Request account deletion? Your account will be deactivated and reviewed. Some records may be retained where legally required.')) return;
  try {
    const headers = await authHeaders();
    if(!headers){ toast('Your session expired. Please sign in again.','error',true); return; }
    const resp = await fetch('/api/contractor-workflow', {
      method:'POST', headers,
      body: JSON.stringify({ action:'request_deletion' })
    });
    if(!resp.ok){
      console.error('request_deletion failed HTTP', resp.status);
      toast('Could not submit deletion request','error'); return;
    }
    toast('Account deletion requested. You will receive a confirmation email.','error');
  } catch(e){
    console.error(e); toast('Could not submit deletion request','error');
  }
}

    last_name: p.lastName || null,

    years_in_business: p.years ? Number(p.years) : null,
    number_of_employees: p.employees ? String(p.employees) : null,
    phone: p.phone || null,
    website_url: p.website || null,
    state: p.state || null,
    service_zips: state.zips.join(','),

    services_detail: state.servicesDetail,
    num_technicians: o.technicians ? Number(o.technicians) : null,
    num_vehicles: o.vehicles ? Number(o.vehicles) : null,
    business_hours: Object.assign({}, o.hours, { _confirmed: !!o.hoursConfirmed }),
    scheduling_system: o.scheduling || null,

    insurance_carrier: i.carrier || null,

  };
  try {
    const { error } = await sb.from('contractors').update(payload).eq('id', state.contractorId);
    if(error){ console.error('persistProfile error', error); return false; }
    return true;
  } catch(e){ console.error('persistProfile exception', e); return false; }

// ==================== STATUS MAPPING ====================
// DB stores human-readable strings ("Pending Profile", "Pending Review",
// "Active", "Deleted"). UI uses short keys ("pending", "review", "active").
// EXACT map. Substring matching was wrong in a way that mattered:
// 'Inactive'.includes('active') === true, so a deactivated contractor
// rendered the full Active dashboard. Blocked states get their own key so
// they cannot be shown ordinary onboarding UI. The API stays authoritative —
// this only decides what is rendered.
const DB_TO_UI_STATUS = {
  'new':                 'pending',
  'pending profile':     'pending',
  'pending verification':'pending',   // legacy rows
  'paid':                'pending',   // legacy rows
  'pending review':      'review',
  'active':              'active',
  'inactive':            'blocked',
  'rejected':            'blocked',
  'suspended':           'blocked',
  'deletion requested':  'blocked',
  'deleted':             'blocked',
};
function uiStatusFrom(dbStatus){
  const key = String(dbStatus||'').trim().toLowerCase();
  // Unknown status -> 'pending', never 'active'. Fail closed.
  return DB_TO_UI_STATUS[key] || 'pending';
}
function dbStatusFrom(uiStatus){
  if(uiStatus==='active') return 'Active';
  if(uiStatus==='review') return 'Pending Review';
  return 'Pending Profile';
}
function isBlockedStatus(dbStatus){ return uiStatusFrom(dbStatus) === 'blocked'; }
