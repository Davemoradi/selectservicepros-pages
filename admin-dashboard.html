<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SSP Operations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#0f2740;--orange:#f05528;--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#687386;--line:#e3e8ef;--good:#157347;--warn:#a15c00;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}.hidden{display:none!important}.shell{min-height:100vh}.top{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:-.02em}.brand span{color:var(--orange)}.top-right{display:flex;gap:12px;align-items:center;font-size:13px}.linkbtn{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.login{max-width:420px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 12px 40px rgba(15,39,64,.12)}.login h1{margin:0 0 6px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn.primary{background:var(--orange);color:#fff}.btn.secondary{background:#eef2f6;color:var(--navy)}.btn.danger{background:#fff0ee;color:var(--bad)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.main{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.navbtn{width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px 12px;color:#3c4658;cursor:pointer;margin:2px 0}.navbtn.active{background:#fff0ea;color:#bc3d17;font-weight:800}.content{padding:24px;min-width:0}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}.pagehead h1{margin:0;font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.metric{font-size:28px;font-weight:800;margin-top:6px}.metric-label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}.section{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:18px;overflow:hidden}.section-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:16px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;background:#fafbfc}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2f6;color:#4a5568;font-size:11px;font-weight:800}.pill.good{background:#e8f7ef;color:var(--good)}.pill.warn{background:#fff4e5;color:var(--warn)}.pill.bad{background:#fff0ee;color:var(--bad)}.actions{display:flex;gap:6px;flex-wrap:wrap}.money{font-variant-numeric:tabular-nums}.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:240px}.notice{padding:10px 12px;border-radius:8px;background:#fff7ed;color:#8a4b08;font-size:13px}.error{color:var(--bad);font-size:13px;margin-top:8px}.muted{color:var(--muted)}.detail{font-size:12px;color:var(--muted);line-height:1.5;max-width:420px;white-space:normal}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.navbtn{width:auto;white-space:nowrap}.content{padding:16px}}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{padding:0 14px}.pagehead{display:block}.search{width:100%;margin-top:10px}}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <h1>SSP Operations</h1>
  <p class="sub">Sign in with an authorized admin account. There is no shared admin password.</p>
  <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="username"/></div>
  <div class="field"><label>Password</label><input id="login-password" type="password" autocomplete="current-password"/></div>
  <button id="login-btn" class="btn primary" style="width:100%">Sign in</button>
  <button type="button" id="admin-google-btn" class="btn secondary" style="width:100%;margin-top:10px;border:1px solid #d6dee6;background:#fff">Continue with Google</button>
  <div style="margin-top:14px;text-align:center"><button type="button" id="forgot-btn" class="btn secondary">Forgot password / Set up admin access</button></div>
  <p id="reset-message" class="sub" role="status"></p>
  <div id="login-error" class="error"></div>
</div>

<div id="app" class="shell hidden">
  <div class="top"><div class="brand">Select <span>Service</span> Pros · Operations</div><div class="top-right"><span id="admin-email"></span><button class="linkbtn" onclick="logout()">Sign out</button></div></div>
  <div class="main">
    <aside class="side" id="nav"></aside>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
const SUPABASE_URL='https://kasqtxwbsmjlisbnebku.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_vNTt8FXb9XdBQ_Asd1QPTg_luc7D8Fz';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const state={tab:'overview',data:null,search:'',busy:false,selectedContractor:null,selectedTask:null};
const initialTab=new URLSearchParams(location.search).get('tab');if(['overview','contractors','queue','communications','leads','pricing','disputes','staff','alerts'].includes(initialTab))state.tab=initialTab;
const tabs=[['overview','Overview'],['contractors','Contractors'],['queue','Work Queue'],['alerts','Alerts'],['communications','Communications'],['leads','Leads'],['pricing','Pricing'],['disputes','Disputes'],['staff','Employees']];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(c){return '$'+((Number(c)||0)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function date(v){if(!v)return '—';try{return new Date(v).toLocaleString()}catch{return esc(v)}}
function pill(status){const s=String(status||'');const c=s==='Active'||s==='Matched'||s==='accepted'?'good':/Pending|Offering|offered/i.test(s)?'warn':/Rejected|Suspended|Unmatched|declined|expired/i.test(s)?'bad':'';return `<span class="pill ${c}">${esc(s||'—')}</span>`}
function token(){return sb.auth.getSession().then(x=>x.data.session?.access_token||null)}
async function api(url,opts={}){const t=await token();if(!t)throw new Error('signed_out');const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+t,...(opts.headers||{})}});const b=await r.json().catch(()=>({}));if(r.status===401||r.status===403){if(b.error==='admin_required')throw new Error('admin_required')}if(!r.ok)throw new Error(b.error||'request_failed');return b}
async function load(){
 if(state.busy)return;
 state.busy=true;state.loadError=null;render();
 try{
  const payload=await api('/api/admin?action=data&_refresh='+Date.now(),{cache:'no-store'});
  if(!payload||payload.ok!==true)throw new Error('invalid_operations_response');
  state.data=payload;state.lastRefreshed=new Date().toISOString();
  document.getElementById('admin-email').textContent=state.data.admin?.email||'';
 }catch(e){
  if(e.message==='admin_required'){const signed=await sb.auth.getUser();const used=signed.data?.user?.email||'this account';await sb.auth.signOut();showLogin('Signed in as '+used+', but this account is not authorized for SSP Operations.');return}
  console.error('Operations refresh failed',e);state.loadError=e.message||'request_failed';
 }finally{state.busy=false;render()}
}
function setTab(t){state.tab=t;if(t!=='task-detail')state.selectedTask=null;const u=new URL(location.href);u.searchParams.set('tab',t==='task-detail'?'queue':t);history.replaceState(null,'',u);render()}
function renderNav(){const allowed=state.data?.admin?.staff_only?[['queue','Work Queue'],['alerts','Alerts']]:tabs;document.getElementById('nav').innerHTML=allowed.map(([k,l])=>`<button class="navbtn ${state.tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('')}
function render(){if(document.getElementById('app').classList.contains('hidden'))return;renderNav();const c=document.getElementById('content');if(state.busy&&!state.data){c.innerHTML='<div class="notice">Loading SSP operations…</div>';return}const d=state.data;if(!d){c.innerHTML='<div class="notice">'+(state.loadError?'Refresh failed: '+esc(state.loadError):'No data loaded.')+' <button class="btn small secondary" onclick="load()">Retry</button></div>';return}if(d.admin?.staff_only&&state.tab!=='queue'&&state.tab!=='task-detail'&&state.tab!=='alerts'){state.tab='queue';renderNav()}if(state.tab==='overview')c.innerHTML=overview(d);if(state.tab==='contractors')c.innerHTML=contractors(d);if(state.tab==='leads')c.innerHTML=leads(d);if(state.tab==='pricing')c.innerHTML=pricing(d);if(state.tab==='disputes')c.innerHTML=disputes(d);if(state.tab==='communications')c.innerHTML=communications(d);if(state.tab==='queue')c.innerHTML=workQueue(d);if(state.tab==='alerts')c.innerHTML=operationsAlerts(d);if(state.tab==='staff')c.innerHTML=employees(d);if(state.tab==='task-detail')c.innerHTML=taskDetail(d);if(state.tab==='detail')c.innerHTML=contractorDetail(d);const msg=state.loadError?'<span style="color:#be123c">Refresh failed: '+esc(state.loadError)+'</span>':state.busy?'Refreshing…':state.lastRefreshed?'Updated '+esc(new Date(state.lastRefreshed).toLocaleTimeString()):'';const indicator=document.createElement('div');indicator.id='ops-refresh-status';indicator.setAttribute('role','status');indicator.style.cssText='padding:8px 16px;font-size:12px;color:#64748b';indicator.innerHTML=msg;c.prepend(indicator)}
function overview(d){const s=d.stats||{};return `<div class="pagehead"><div><h1>Overview</h1><p class="sub">Live operational state from Supabase. No tier/MRR model.</p></div><button class="btn secondary" onclick="load()">Refresh</button></div><div class="grid">${metric('Active contractors',s.contractors_active)}${metric('Pending review',s.contractors_pending_review)}${metric('Accepted offers',s.accepted_offers)}${metric('Open disputes',s.disputes_open)}${metric('Purchased wallet',money(s.paid_wallet_cents))}${metric('Promo wallet',money(s.promo_wallet_cents))}${metric('Founding 25',`${s.founding25_grants||0}/25`)}${metric('Lead charges',money(s.lead_charge_cents))}${metric('Stripe top-ups',money(s.stripe_topup_cents))}</div><div class="section"><div class="section-head"><h2>Matching snapshot</h2></div><div class="grid" style="padding:16px">${metric('Offering',s.leads_offering)}${metric('Matched',s.leads_matched)}${metric('Unmatched',s.leads_unmatched)}${metric('Pricing held',s.pricing_held)}</div></div>`}
function metric(l,v){return `<div class="card"><div class="metric-label">${esc(l)}</div><div class="metric">${esc(v??0)}</div></div>`}
function contractorFiltered(d){const q=state.search.trim().toLowerCase();return (d.contractors||[]).filter(c=>!q||[c.company_name,c.first_name,c.last_name,c.email,c.phone,c.status,c.contractor_number].some(v=>String(v||'').toLowerCase().includes(q)))}
function contractors(d){const rows=contractorFiltered(d);return `<div class="pagehead"><div><h1>Contractors</h1><p class="sub">Approve credentials, manage status, and issue the one-time Founding 25 promotional credit.</p></div><input class="search" placeholder="Search contractors" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div><div class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Contractor</th><th>Status</th><th>Wallet</th><th>Insurance</th><th>Licenses</th><th>Actions</th></tr></thead><tbody>${rows.map(contractorRow).join('')||'<tr><td colspan="6">No contractors.</td></tr>'}</tbody></table></div></div>`}
function contractorRow(c){const ls=c.licenses||[];const verified=ls.filter(x=>x.verified).length;const insView=c.insurance_doc_url?`<button class="btn small secondary" onclick="viewDocument('${c.id}','insurance')">View certificate</button>`:'<span class="detail">No certificate uploaded</span>';const licenseHtml=ls.map(l=>`<div style="margin-top:5px"><span>${esc(l.trade_category||'License')}: ${esc(l.license_number||'')} ${l.verified?'✓':''}</span> ${l.document_url?`<button class="btn small secondary" onclick="viewDocument('${c.id}','license','${l.id}')">View</button>`:''} <button class="btn small secondary" onclick="setLicense('${c.id}','${l.id}',${!l.verified})">${l.verified?'Unverify':'Verify'}</button></div>`).join('')||'<div class="detail">No license rows</div>';return `<tr><td><button class="btn small secondary" onclick="state.selectedContractor='${c.id}';state.tab='detail';render()">${esc(c.company_name||[c.first_name,c.last_name].filter(Boolean).join(' ')||'Unnamed')} →</button><div class="detail">SSP-${esc(c.contractor_number)} · ${esc(c.email)} · ${esc(c.phone||'')}</div><div class="detail">${esc(c.service_categories||'')}</div></td><td>${pill(c.status)}</td><td class="money">${money((c.promo_credits_cents||0)+(c.lead_balance_cents||0))}<div class="detail">${money(c.promo_credits_cents||0)} promo · ${money(c.lead_balance_cents||0)} paid</div></td><td>${c.insurance_verified?'<span class="pill good">Verified</span>':'<span class="pill warn">Not verified</span>'}<div class="detail">Expires ${esc(c.insurance_expiration||'—')}</div><div class="actions" style="margin-top:6px">${insView}<button class="btn small secondary" onclick="setInsurance('${c.id}',${!c.insurance_verified})">${c.insurance_verified?'Unverify':'Verify'}</button></div></td><td>${verified}/${ls.length} verified${licenseHtml}</td><td><div class="actions">${c.status!=='Active'?`<button class="btn small primary" onclick="approveFounding('${c.id}')">Approve + $250</button><button class="btn small secondary" onclick="activateOnly('${c.id}')">Activate only</button>`:''}<button class="btn small secondary" onclick="setStatus('${c.id}','Pending Review')">Pending review</button><button class="btn small danger" onclick="setStatus('${c.id}','Suspended')">Suspend</button><button class="btn small danger" onclick="setStatus('${c.id}','Rejected')">Reject</button><button class="btn small secondary" onclick="grantPromo('${c.id}')">Grant $250 promo</button></div></td></tr>`}



function employees(d){
 const isOwner=(d.admin?.email||'').toLowerCase()==='david@selectservicepros.com';
 const rows=(d.staff||[]).map(x=>'<tr><td>'+esc(x.first_name||'')+'</td><td>'+esc(x.last_name||'')+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td><td>'+pill(x.employment_status||'Active')+'</td><td>'+(isOwner&&x.email!=='david@selectservicepros.com'?'<select id="employee-status-'+x.id+'">'+['Active','Suspended','Deactivated'].map(v=>'<option value="'+v+'" '+(v===x.employment_status?'selected':'')+'>'+v+'</option>').join('')+'</select> <button class="btn small primary" onclick="saveEmployeeStatus(\''+x.id+'\')">Update</button>':'')+' '+(isOwner?'<button class="btn small secondary" onclick="sendEmployeeRecovery(\''+x.id+'\')">Reset password</button>':'')+'</td></tr>').join('');
 return '<div class="pagehead"><div><h1>Employees</h1><p class="sub">Staff directory for task assignments. Creating an employee provisions a login with access limited to the Work Queue. Use a unique temporary password; employees should reset it after signing in.</p></div></div>'
 +(isOwner?'<div class="section" style="padding:18px"><h3>Add employee</h3><div class="grid"><input id="staff-first" placeholder="First name"><input id="staff-last" placeholder="Last name"><input id="staff-email" placeholder="Work email" type="email"><input id="staff-password" type="password" autocomplete="new-password" minlength="12" placeholder="Initial password (12+ characters)"><select id="staff-role">'+['Operations','Support','Verification','Finance','Manager'].map(x=>'<option>'+x+'</option>').join('')+'</select></div><p><button class="btn primary" onclick="createEmployee()">Add employee</button></p><p id="staff-error" class="error"></p></div>':'<p class="notice">Only the account owner can manage the employee directory.</p>')
 +'<div class="section"><div class="tablewrap"><table class="table"><thead><tr><th>First name</th><th>Last name</th><th>Email</th><th>Team</th><th>Status</th><th>Action</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="6">No employees yet.</td></tr>')+'</tbody></table></div></div>';
}
async function createEmployee(){
 const v=id=>document.getElementById(id).value.trim();
 try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'create_staff',first_name:v('staff-first'),last_name:v('staff-last'),email:v('staff-email'),password:v('staff-password'),role:v('staff-role')})});await load()}
 catch(e){document.getElementById('staff-error').textContent='Could not add employee: '+e.message}
}
async function sendEmployeeRecovery(id){
 const employee=(state.data?.staff||[]).find(x=>x.id===id);if(!employee)return;
 if(!confirm('Send a password recovery email to '+employee.email+'? This requires an existing login account.'))return;
 try{const {error}=await sb.auth.resetPasswordForEmail(employee.email,{redirectTo:location.origin+'/reset-password.html?admin=1'});if(error)throw error;toast('If a login exists for that email, a recovery email has been requested. An employee directory entry alone does not create a login.');}
 catch(e){toast('Password recovery failed: '+(e.message||'Please retry later.'))}
}
async function saveEmployeeStatus(staff_id){const status=document.getElementById('employee-status-'+staff_id)?.value;if(!status)return;if(!confirm('Set employee status to '+status+'?'))return;try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'set_staff_status',staff_id,status})});await load()}catch(e){toast('Status update failed: '+e.message)}}


function collectOpsAlerts(d){
 const out=[];
 const contractors=d.contractors||[];
 const company=id=>contractors.find(c=>c.id===id)?.company_name||'Contractor';
 (d.tasks||[]).filter(t=>!['Done','Cancelled'].includes(t.status)).forEach(t=>{
  if(t.automation_key||t.priority==='Urgent'||t.due_at&&new Date(t.due_at)<new Date()){
   out.push({key:'task:'+t.id,title:t.automation_key?'Document review: '+company(t.contractor_id):t.title,detail:t.automation_key?'Uploaded document requires verification':t.due_at&&new Date(t.due_at)<new Date()?'Overdue task':'Urgent task',when:t.updated_at||t.created_at,kind:'task',id:t.id});
  }
 });
 if(!d.admin?.staff_only){
  (d.contractors||[]).filter(c=>['Pending Review','Pending Verification'].includes(c.status)).forEach(c=>out.push({key:'application:'+c.id,title:'Contractor awaiting review: '+company(c.id),detail:c.status,when:c.created_at,kind:'contractor',id:c.id}));
  (d.disputes||[]).filter(x=>!x.decision||x.decision==='pending').forEach(x=>out.push({key:'dispute:'+x.id,title:'Lead dispute: '+company(x.contractor_id),detail:'Awaiting decision',when:x.submitted_at,kind:'disputes',id:x.id}));
  (d.notifications||[]).filter(x=>['failed','error','dead','dead_letter'].includes(String(x.status||'').toLowerCase())).forEach(x=>out.push({key:'notification:'+x.id,title:'Failed notification: '+x.event_type,detail:x.last_error||'Delivery failure',when:x.created_at,kind:'communications',id:x.id}));
 }
 const read=new Set((d.alert_reads||[]).map(x=>x.alert_key));
 return out.map(x=>({...x,read:read.has(x.key)})).sort((a,b)=>Number(a.read)-Number(b.read)||new Date(b.when||0)-new Date(a.when||0));
}
function operationsAlerts(d){
 const alerts=collectOpsAlerts(d), unread=alerts.filter(x=>!x.read).length;
 const assignees=(d.staff||[]).filter(x=>x.active).map(x=>'<option value="'+esc(x.email)+'">'+esc(x.name||x.email)+'</option>').join('');
 const taskFor=a=>a.kind==='task'?(d.tasks||[]).find(x=>x.id===a.id):(d.tasks||[]).find(x=>x.automation_key==='alert:'+a.key);
 return '<div class="pagehead"><div><h1>Operations Alerts</h1><p class="sub">Live exceptions from SSP records. Read status is personal to your login.</p></div><button class="btn secondary" onclick="load()">Refresh</button></div>'
 +'<div class="grid">'+metric('Unread alerts',unread)+metric('Total active alerts',alerts.length)+'</div>'
 +'<div class="section" style="padding:14px">'+(alerts.map(a=>'<div style="padding:13px;border-bottom:1px solid #e7ebef"><b>'+esc(a.title)+'</b> '+(a.read?'<span class="detail">Read</span>':'<span class="detail">● Unread</span>')+'<p class="detail">'+esc(a.detail)+' · '+date(a.when)+'</p>'+(taskFor(a)?'<button class="btn small primary" onclick="openOpsTask(\''+taskFor(a).id+'\')">View Task ('+esc(taskFor(a).status)+')</button> ':a.kind==='task'?'':'<select aria-label="Assign employee" id="alert-owner-'+esc(a.id)+'"><option value="">Assign employee…</option>'+assignees+'</select> <button class="btn small primary" onclick="convertOpsAlert(\''+esc(a.key)+'\',\''+esc(a.id)+'\')">Create Task</button> ')+'<button class="btn small secondary" onclick="openOpsAlert(\''+esc(a.kind)+'\',\''+esc(a.id)+'\')">Open record</button> <button class="btn small secondary" onclick="setOpsAlertRead(\''+esc(a.key)+'\','+(!a.read)+')">'+(a.read?'Mark unread':'Mark read')+'</button></div>').join('')||'<p>No active alerts.</p>')+'</div>';
}
async function convertOpsAlert(key,id){
 const assigned_to=document.getElementById('alert-owner-'+id)?.value||'';
 if(!assigned_to){toast('Choose an employee first.');return}
 try{const r=await api('/api/admin',{method:'POST',body:JSON.stringify({action:'create_alert_task',alert_key:key,assigned_to})});await load();openOpsTask(r.task_id)}
 catch(e){toast('Could not create task: '+e.message)}
}
async function setOpsAlertRead(key,read){try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'mark_ops_alert',alert_key:key,read})});await load()}catch(e){toast('Alert update failed: '+e.message)}}
function openOpsAlert(kind,id){
 if(kind==='task'){openOpsTask(id);return}
 if(kind==='contractor'){state.selectedContractor=id;setTab('detail');return}
 setTab(kind);
}

function workQueue(d){
 const tasks=d.tasks||[], contractors=d.contractors||[];
 const active=tasks.filter(x=>!['Done','Cancelled'].includes(x.status));
 const overdue=active.filter(x=>x.due_at&&new Date(x.due_at)<new Date()).length;
 const high=active.filter(x=>['High','Urgent'].includes(x.priority)).length;
 const review=contractors.filter(x=>x.status==='Pending Review'||x.status==='Pending Verification').length;
 const due=contractors.filter(x=>x.insurance_expiration&&new Date(x.insurance_expiration)<new Date(Date.now()+30*86400000)).length;

async function createOpsTask(){
 const v=id=>document.getElementById(id).value;
 const title=v('task-title').trim(),details=v('task-details').trim(),contractor_id=v('task-contractor')||null,priority=v('task-priority'),assigned_to=v('task-owner').trim(),due_at=v('task-due')?new Date(v('task-due')).toISOString():null;
 if(title.length<3){document.getElementById('task-feedback').textContent='Enter a task title (at least three characters).';return}
 try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'create_task',title,details,contractor_id,priority,assigned_to,due_at})});await load()}
 catch(e){document.getElementById('task-feedback').textContent='Unable to create task: '+e.message}
}
async function updateOpsTask(task_id){
 const task=(state.data.tasks||[]).find(t=>t.id===task_id);if(!task)return;
 const status=document.getElementById('status-'+task_id)?.value;if(!status)return;
 try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'update_task',task_id,fields:{status},expected_updated_at:task.updated_at})});await load()}
 catch(e){toast('Task update failed: '+e.message);await load()}
}

function leads(d){const q=state.search.trim().toLowerCase();const offers=d.offers||[];const counts={};offers.forEach(o=>{if(!counts[o.lead_id])counts[o.lead_id]={all:0,accepted:0,live:0};counts[o.lead_id].all++;if(o.status==='accepted')counts[o.lead_id].accepted++;if(o.status==='offered')counts[o.lead_id].live++});const rows=(d.leads||[]).filter(l=>!q||[l.id,l.homeowner_name,l.homeowner_phone,l.homeowner_email,l.homeowner_zip,l.service_category,l.service_type,l.issue_code,l.status].some(v=>String(v||'').toLowerCase().includes(q)));return `<div class="pagehead"><div><h1>Leads</h1><p class="sub">Recent homeowner requests and matching state.</p></div><input class="search" placeholder="Search leads" value="${esc(state.search)}" oninput="state.search=this.value;render()"></div><div class="section"><div class="tablewrap"><table class="table"><thead><tr><th>Created</th><th>Homeowner</th><th>Job</th><th>Status</th><th>Price</th><th>Offers</th></tr></thead><tbody>${rows.map(l=>{const n=counts[l.id]||{all:0,accepted:0,live:0};return `<tr><td>${date(l.created_at)}<div class="detail">${esc(l.id)}</div></td><td>${esc(l.homeowner_name||'—')}<div class="detail">${esc(l.homeowner_phone||'')} · ${esc(l.homeowner_email||'')} · ${esc(l.homeowner_zip||'')}</div></td><td><strong>${esc(l.service_category||'')}</strong><div class="detail">${esc(l.service_type||'')} · ${esc(l.issue_code||'')} · ${esc(l.urgency||'')}</div></td><td>${pill(l.status)}</td><td>${l.price_cents==null?'—':money(l.price_cents)}<div class="detail">${esc(l.pricing_band||'')} ${esc(l.pricing_version||'')}</div></td><td>${n.accepted} accepted · ${n.live} live<div class="detail">${n.all} total offer rows</div></td></tr>`}).join('')||'<tr><td colspan="6">No leads.</td></tr>'}</tbody></table></div></div>`}

function setLicense(cid,lid,verified){mutate({action:'set_license_verified',contractor_id:cid,license_id:lid,verified})}
function grantPromo(id){if(!confirm('Grant the one-time $250 Founding 25 promotional lead credit?'))return;mutate({action:'grant_founding25',contractor_id:id})}
async function viewDocument(contractorId,kind,licenseId){try{const b={contractor_id:contractorId,kind};if(licenseId)b.license_id=licenseId;const r=await api('/api/admin',{method:'POST',body:JSON.stringify({...b,action:'document_url'})});window.open(r.url,'_blank','noopener,noreferrer')}catch(e){toast('Could not open document: '+e.message)}}
async function decideDispute(id,decision){if(!confirm(`${decision==='approved'?'Approve':'Reject'} this dispute?`))return;state.busy=true;try{await api('/api/admin',{method:'POST',body:JSON.stringify({action:'decide_dispute',dispute_id:id,decision})});await load()}catch(e){console.error(e);toast('Decision failed: '+e.message)}finally{state.busy=false}}
function toast(msg){alert(msg)}
async function logout(){await sb.auth.signOut();location.reload()}
function showLogin(msg=''){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('login-error').textContent=msg}
async function login(){const btn=document.getElementById('login-btn');btn.disabled=true;document.getElementById('login-error').textContent='';const email=document.getElementById('login-email').value.trim();const password=document.getElementById('login-password').value;const {error}=await sb.auth.signInWithPassword({email,password});btn.disabled=false;if(error){showLogin('Sign-in failed: '+error.message);return}await boot()}
async function adminGoogleSignIn(){
 const btn=document.getElementById('admin-google-btn');btn.disabled=true;
 try{
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/admin-dashboard.html',queryParams:{prompt:'select_account'}}});
  if(error)throw error;
 }catch(e){showLogin('Google sign-in could not be started. Please try again or use password recovery.');btn.disabled=false;}
}
async function requestAdminRecovery(){
 const email=document.getElementById('login-email').value.trim();
 const feedback=document.getElementById('reset-message');
 if(!email){feedback.textContent='Enter your admin email above first.';return;}
 const btn=document.getElementById('forgot-btn');btn.disabled=true;
 try{
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/reset-password.html?admin=1'});
  feedback.textContent=error?('Password recovery failed: '+error.message+'. If this is your first login, create the admin user in Supabase Authentication → Users using Send invitation.'):'If this email has an SSP login, check your inbox for a password setup or reset link.';
 }catch(e){feedback.textContent='Unable to request a reset right now. Please try again.';}
 finally{btn.disabled=false;}
}
async function boot(){const {data:{session},error}=await sb.auth.getSession();if(!session){const p=new URLSearchParams(location.search);const e=p.get('error_description')||p.get('error');showLogin(e?('Google sign-in failed: '+e):'');return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load();const p=new URLSearchParams(location.search);if(p.get('tab')==='queue'&&p.get('task')&&(state.data.tasks||[]).some(t=>t.id===p.get('task'))){state.selectedTask=p.get('task');state.tab='task-detail';render()}}
document.getElementById('login-btn').addEventListener('click',login);document.getElementById('forgot-btn').addEventListener('click',requestAdminRecovery);document.getElementById('admin-google-btn').addEventListener('click',adminGoogleSignIn);document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});boot();
</script>
</body>
</html>
